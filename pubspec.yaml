name: gistour
description: "GisTour - Aplikasi wisata destinasi Gisting, Kabupaten Tanggamus, Lampung."
publish_to: "none"

version: 1.0.0+4

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Material Design
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.10

  # Authentication & Sign In
  google_sign_in: ^6.2.1

  # State Management
  provider: ^6.1.0

  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0

  # Preferences
  shared_preferences: ^2.2.2

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0

  flutter_local_notifications: ^19.4.0

  # Date & Time
  intl: ^0.19.0

  # Loading & Dialogs
  flutter_spinkit: ^5.2.0

  # Image Handling
  image_picker: ^1.0.4
  cached_network_image: ^3.3.1

  # UUID for generating unique IDs
  uuid: ^4.0.0

  # URL Launcher (for opening maps)
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
